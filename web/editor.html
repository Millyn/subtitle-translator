<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>字幕样式编辑器</title><style>
:root{--panel:#121923;--line:#304050;--accent:#51a8ff;--bg:#09111a;--text:#e9f0f7;--muted:#8fa1b2}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
.layout{display:grid;grid-template-columns:1fr 360px;height:100%}
.preview{position:relative;overflow:hidden;background:#000}
#subtitle{position:absolute;left:var(--x,50%);top:var(--y,88%);transform:translate(-50%,-50%);width:max-content;max-width:var(--width,90%);padding:12px 24px;border-radius:12px;text-align:center;background:var(--sub-bg,rgba(0,0,0,.48));overflow-wrap:anywhere}
#english{color:var(--ec,#fff);font-size:var(--en,56px);font-weight:750;line-height:1.18;-webkit-text-stroke:2px var(--stroke,#000);paint-order:stroke fill;text-shadow:0 2px 5px var(--stroke,#000)}
#chinese{margin-bottom:5px;color:var(--zc,#eee);font-size:var(--zh,30px);font-weight:650;-webkit-text-stroke:1px var(--stroke,#000);paint-order:stroke fill;text-shadow:0 1px 3px var(--stroke,#000)}
.sidebar{padding:20px;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line)}
h1{margin:0 0 20px;font-size:20px;color:var(--accent)}
h2{margin:16px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:4px;font-size:13px;color:var(--muted)}
.field input,.field select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#1d2a37;color:var(--text);font-size:14px}
.field input[type=color]{height:36px;padding:2px}
.field input[type=range]{padding:0}
.row{display:flex;gap:8px}
.row .field{flex:1}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.secondary{background:#243443}
.btn.danger{background:#572b32}
.actions{display:flex;gap:8px;margin-top:20px}
.preview-label{position:absolute;top:10px;left:10px;padding:4px 8px;background:rgba(0,0,0,.6);border-radius:4px;font-size:12px;color:var(--muted)}
</style></head><body>
<div class="layout">
<div class="preview">
<div class="preview-label">实时预览</div>
<div id="subtitle"><div id="chinese">这是中文字幕示例</div><div id="english">This is English subtitle example</div></div>
</div>
<div class="sidebar">
<h1>字幕样式编辑器</h1>

<h2>显示模式</h2>
<div class="field"><label>字幕模式</label><select id="mode"><option value="bilingual">双语（中+英）</option><option value="english">仅英文</option></select></div>

<h2>字体大小</h2>
<div class="row">
<div class="field"><label>英文字号</label><input id="enSize" type="range" min="20" max="120" value="56"><span id="enSizeVal">56px</span></div>
<div class="field"><label>中文字号</label><input id="zhSize" type="range" min="12" max="60" value="30"><span id="zhSizeVal">30px</span></div>
</div>

<h2>位置</h2>
<div class="row">
<div class="field"><label>水平位置 (%)</label><input id="posX" type="range" min="0" max="100" value="50"><span id="posXVal">50%</span></div>
<div class="field"><label>垂直位置 (%)</label><input id="posY" type="range" min="0" max="100" value="88"><span id="posYVal">88%</span></div>
</div>
<div class="field"><label>最大宽度 (%)</label><input id="maxWidth" type="range" min="20" max="100" value="90"><span id="maxWidthVal">90%</span></div>

<h2>颜色</h2>
<div class="row">
<div class="field"><label>英文颜色</label><input id="enColor" type="color" value="#ffffff"></div>
<div class="field"><label>中文颜色</label><input id="zhColor" type="color" value="#eeeeee"></div>
</div>
<div class="row">
<div class="field"><label>描边颜色</label><input id="strokeColor" type="color" value="#000000"></div>
<div class="field"><label>背景颜色</label><input id="bgColor" type="color" value="#000000"></div>
</div>
<div class="field"><label>背景透明度</label><input id="bgOpacity" type="range" min="0" max="100" value="48"><span id="bgOpacityVal">48%</span></div>

<h2>其他</h2>
<div class="field"><label>字幕隐藏延迟 (ms)</label><input id="hideDelay" type="number" min="0" max="30000" value="12000" step="1000"></div>
<div class="field"><label>字体</label><input id="fontFamily" type="text" value='Segoe UI, Microsoft YaHei, sans-serif'></div>

<div class="actions">
<button class="btn" onclick="applyToSubtitle()">应用到字幕页</button>
<button class="btn secondary" onclick="copyURL()">复制字幕 URL</button>
<button class="btn secondary" onclick="resetDefaults()">恢复默认</button>
</div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const state={mode:'bilingual',enSize:56,zhSize:30,posX:50,posY:88,maxWidth:90,enColor:'#ffffff',zhColor:'#eeeeee',strokeColor:'#000000',bgColor:'#000000',bgOpacity:48,hideDelay:12000,fontFamily:'Segoe UI, Microsoft YaHei, sans-serif'};

function updatePreview(){
const r=document.documentElement.style;
r.setProperty('--en',state.enSize+'px');
r.setProperty('--zh',state.zhSize+'px');
r.setProperty('--x',state.posX+'%');
r.setProperty('--y',state.posY+'%');
r.setProperty('--width',state.maxWidth+'%');
r.setProperty('--ec',state.enColor);
r.setProperty('--zc',state.zhColor);
r.setProperty('--stroke',state.strokeColor);
r.setProperty('--sub-bg',hexToRgba(state.bgColor,state.bgOpacity/100));
r.setProperty('--font',state.fontFamily);
$('#chinese').style.display=state.mode==='english'?'none':'block';
}

function hexToRgba(hex,a){
const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
return`rgba(${r},${g},${b},${a})`;
}

function syncUI(){
$('#mode').value=state.mode;
$('#enSize').value=state.enSize;$('#enSizeVal').textContent=state.enSize+'px';
$('#zhSize').value=state.zhSize;$('#zhSizeVal').textContent=state.zhSize+'px';
$('#posX').value=state.posX;$('#posXVal').textContent=state.posX+'%';
$('#posY').value=state.posY;$('#posYVal').textContent=state.posY+'%';
$('#maxWidth').value=state.maxWidth;$('#maxWidthVal').textContent=state.maxWidth+'%';
$('#enColor').value=state.enColor;
$('#zhColor').value=state.zhColor;
$('#strokeColor').value=state.strokeColor;
$('#bgColor').value=state.bgColor;
$('#bgOpacity').value=state.bgOpacity;$('#bgOpacityVal').textContent=state.bgOpacity+'%';
$('#hideDelay').value=state.hideDelay;
$('#fontFamily').value=state.fontFamily;
}

function bindEvents(){
$('#mode').onchange=e=>{state.mode=e.target.value;updatePreview()};
$('#enSize').oninput=e=>{state.enSize=+e.target.value;$('#enSizeVal').textContent=state.enSize+'px';updatePreview()};
$('#zhSize').oninput=e=>{state.zhSize=+e.target.value;$('#zhSizeVal').textContent=state.zhSize+'px';updatePreview()};
$('#posX').oninput=e=>{state.posX=+e.target.value;$('#posXVal').textContent=state.posX+'%';updatePreview()};
$('#posY').oninput=e=>{state.posY=+e.target.value;$('#posYVal').textContent=state.posY+'%';updatePreview()};
$('#maxWidth').oninput=e=>{state.maxWidth=+e.target.value;$('#maxWidthVal').textContent=state.maxWidth+'%';updatePreview()};
$('#enColor').oninput=e=>{state.enColor=e.target.value;updatePreview()};
$('#zhColor').oninput=e=>{state.zhColor=e.target.value;updatePreview()};
$('#strokeColor').oninput=e=>{state.strokeColor=e.target.value;updatePreview()};
$('#bgColor').oninput=e=>{state.bgColor=e.target.value;updatePreview()};
$('#bgOpacity').oninput=e=>{state.bgOpacity=+e.target.value;$('#bgOpacityVal').textContent=state.bgOpacity+'%';updatePreview()};
$('#hideDelay').onchange=e=>{state.hideDelay=+e.target.value};
$('#fontFamily').onchange=e=>{state.fontFamily=e.target.value;updatePreview()};
}

function applyToSubtitle(){
const params=new URLSearchParams({
mode:state.mode,
enSize:state.enSize,
zhSize:state.zhSize,
x:state.posX,
y:state.posY,
width:state.maxWidth,
enColor:state.enColor,
zhColor:state.zhColor,
stroke:state.strokeColor,
bg:hexToRgba(state.bgColor,state.bgOpacity/100),
hide:state.hideDelay,
font:state.fontFamily
});
const url=`${location.origin}/subtitle?${params}`;
window.open(url,'_blank');
}

function copyURL(){
const params=new URLSearchParams({
mode:state.mode,
enSize:state.enSize,
zhSize:state.zhSize,
x:state.posX,
y:state.posY,
width:state.maxWidth,
enColor:state.enColor,
zhColor:state.zhColor,
stroke:state.strokeColor,
bg:hexToRgba(state.bgColor,state.bgOpacity/100),
hide:state.hideDelay,
font:state.fontFamily
});
const url=`${location.origin}/subtitle?${params}`;
navigator.clipboard.writeText(url).then(()=>alert('已复制到剪贴板'));
}

function resetDefaults(){
Object.assign(state,{mode:'bilingual',enSize:56,zhSize:30,posX:50,posY:88,maxWidth:90,enColor:'#ffffff',zhColor:'#eeeeee',strokeColor:'#000000',bgColor:'#000000',bgOpacity:48,hideDelay:12000,fontFamily:'Segoe UI, Microsoft YaHei, sans-serif'});
syncUI();updatePreview();
}

syncUI();bindEvents();updatePreview();
</script></body></html>
