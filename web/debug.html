<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时调试面板</title><style>
:root{--panel:#121923;--line:#304050;--accent:#51a8ff;--bg:#09111a;--text:#e9f0f7;--muted:#8fa1b2;--error:#ff6b6b;--success:#51cf66}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg)}
.container{display:flex;flex-direction:column;height:100%;padding:16px;gap:16px}
.header{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:20px;color:var(--accent)}
.status{padding:6px 12px;border-radius:99px;background:#243443;color:#b9d7ee;font-size:13px}
.status.ok{background:#173e30;color:#8ff0be}
.status.error{background:#4c2228;color:#ffc3c8}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metric{padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.metric span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.metric b{font-size:24px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.events-panel{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.events-header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.events-list{flex:1;overflow-y:auto;padding:8px}
.event{padding:12px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:border-color .2s}
.event:hover{border-color:var(--accent)}
.event.active{border-color:var(--accent);background:rgba(81,168,255,.05)}
.event.error{border-left:3px solid var(--error)}
.event-meta{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.event-meta b{color:var(--text)}
.event-text{font-size:13px;line-height:1.5}
.event-text .en{color:var(--accent)}
.event-text .diff{color:var(--muted);font-size:12px;margin-top:4px}
.detail-panel{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.detail-header{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.detail-content{flex:1;overflow-y:auto;padding:16px}
.detail-section{margin-bottom:20px}
.detail-section h3{margin:0 0 8px;font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.detail-box{background:#0d1520;border:1px solid var(--line);border-radius:6px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto}
.detail-box.request{border-left:3px solid var(--accent)}
.detail-box.response{border-left:3px solid var(--success)}
.detail-kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
.detail-kv dt{color:var(--muted)}
.detail-kv dd{margin:0}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style></head><body>
<div class="container">
<div class="header">
<h1>实时调试面板</h1>
<span id="status" class="status">正在连接…</span>
</div>
<div class="metrics">
<div class="metric"><span>事件数</span><b id="mEvents">0</b></div>
<div class="metric"><span>平均延迟</span><b id="mLatency">—</b></div>
<div class="metric"><span>Token / 缓存</span><b id="mTokens">0 / 0</b></div>
<div class="metric"><span>重试 / 错误</span><b id="mErrors">0 / 0</b></div>
</div>
<div class="main">
<div class="events-panel">
<div class="events-header">事件列表</div>
<div id="eventsList" class="events-list"></div>
</div>
<div class="detail-panel">
<div class="detail-header">事件详情</div>
<div id="detailContent" class="detail-content">
<div class="empty">点击左侧事件查看详情</div>
</div>
</div>
</div>
</div>
<script>
const events=[];
let activeIndex=-1;
let count=0,totalLatency=0,latencyCount=0,tokens=0,hits=0,retries=0,errors=0;

function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}

function updateMetrics(){
document.getElementById('mEvents').textContent=count;
document.getElementById('mLatency').textContent=latencyCount?Math.round(totalLatency/latencyCount)+' ms':'—';
document.getElementById('mTokens').textContent=tokens+' / '+hits;
document.getElementById('mErrors').textContent=retries+' / '+errors;
}

function renderEventList(){
const list=document.getElementById('eventsList');
list.innerHTML='';
events.forEach((e,i)=>{
const div=document.createElement('div');
div.className='event'+(i===activeIndex?' active':'')+(e.error?' error':'');
div.innerHTML=`<div class="event-meta"><span>${new Date((e.ts||Date.now()/1000)*1000).toLocaleTimeString()}</span><b>${esc(e.profile||'—')}</b><span>#${e.segmentId||'—'}</span><span>${e.durationMs||0}ms</span></div><div class="event-text"><span class="en">${esc(e.english||'—')}</span>${e.diff?'<div class="diff">'+esc(e.diff)+'</div>':''}</div>`;
div.onclick=()=>selectEvent(i);
list.appendChild(div);
});
list.scrollTop=list.scrollHeight;
}

function selectEvent(i){
activeIndex=i;
renderEventList();
const e=events[i];
if(!e)return;
const detail=document.getElementById('detailContent');
const latencies=e.latencies||{};
const tokenUsage=e.tokenUsage||{};
detail.innerHTML=`
<div class="detail-section">
<h3>基本信息</h3>
<dl class="detail-kv">
<dt>时间</dt><dd>${new Date((e.ts||Date.now()/1000)*1000).toLocaleTimeString()}</dd>
<dt>Profile</dt><dd>${esc(e.profile||'—')}</dd>
<dt>段落ID</dt><dd>#${e.segmentId||'—'}</dd>
<dt>ASR模型</dt><dd>${esc(e.asrModel||'—')}</dd>
<dt>时长</dt><dd>${e.durationMs||0}ms</dd>
<dt>断句原因</dt><dd>${esc(e.segmentReason||'—')}</dd>
</dl>
</div>
<div class="detail-section">
<h3>识别结果</h3>
<div class="detail-box"><b>原始:</b> ${esc(e.raw||'—')}<br><b>修正:</b> ${esc(e.corrected||'—')}<br><b>英文:</b> ${esc(e.english||'—')}${e.diff?'<br><b>差异:</b> '+esc(e.diff):''}</div>
</div>
<div class="detail-section">
<h3>上下文与术语</h3>
<div class="detail-box"><b>上下文:</b> ${esc((e.context||[]).join('\n')||'—')}<br><b>术语:</b> ${esc((e.terms||[]).join(', ')||'—')}</div>
</div>
<div class="detail-section">
<h3>性能数据</h3>
<dl class="detail-kv">
<dt>ASR耗时</dt><dd>${latencies.asr||'—'}ms</dd>
<dt>翻译耗时</dt><dd>${latencies.translate||'—'}ms</dd>
<dt>总耗时</dt><dd>${latencies.total||'—'}ms</dd>
<dt>重试次数</dt><dd>${e.retries||0}</dd>
</dl>
</div>
<div class="detail-section">
<h3>Token用量</h3>
<dl class="detail-kv">
<dt>Prompt</dt><dd>${tokenUsage.prompt||0}</dd>
<dt>缓存命中</dt><dd>${tokenUsage.cache_hit||0}</dd>
<dt>缓存未命中</dt><dd>${tokenUsage.cache_miss||0}</dd>
<dt>输出</dt><dd>${tokenUsage.output||0}</dd>
<dt>总计</dt><dd>${tokenUsage.total||e.tokens||0}</dd>
</dl>
</div>
<div class="detail-section">
<h3>API请求</h3>
<div class="detail-box request">${esc(e.requestBody||'仅DEBUG模式可用')}</div>
</div>
<div class="detail-section">
<h3>API响应</h3>
<div class="detail-box response">${esc(e.responseBody||'仅DEBUG模式可用')}</div>
</div>
${e.error?'<div class="detail-section"><h3>错误</h3><div class="detail-box" style="border-left-color:var(--error)">'+esc(e.error)+'</div></div>':''}
`;
}

function addEvent(d){
count++;
tokens+=d.tokens||0;
hits+=d.cacheHit?1:0;
retries+=d.retries||0;
errors+=d.error?1:0;
const values=Object.values(d.latencies||{}).filter(Number.isFinite);
const total=d.latencies?.total??(values.length?values.reduce((a,b)=>a+b,0):null);
if(total!=null){totalLatency+=total;latencyCount++}
events.push(d);
if(events.length>200)events.shift();
updateMetrics();
renderEventList();
if(activeIndex===events.length-2)selectEvent(events.length-1);
}

function connect(){
const status=document.getElementById('status');
status.textContent='正在连接…';
status.className='status';
const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/debug-ws`);
ws.onopen=()=>{status.textContent='已连接';status.className='status ok'};
ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='debug'&&m.debug)addEvent(m.debug)}catch{}};
ws.onclose=()=>{status.textContent='已断开，重连中…';status.className='status error';setTimeout(connect,2000)};
ws.onerror=()=>ws.close();
}
connect();
</script></body></html>
