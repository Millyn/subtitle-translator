<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>实时语音翻译</title><style>
:root{--en:56px;--zh:30px;--x:50%;--y:88%;--width:90%;--ec:#fff;--zc:#eee;--stroke:#000;--bg:rgba(0,0,0,.48);--font:"Segoe UI","Microsoft YaHei",sans-serif;--panel:#121923;--line:#304050;--accent:#51a8ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:var(--font)}body.subtitle{overflow:hidden;background:transparent}
#subtitle{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) translateY(8px);width:max-content;max-width:var(--width);padding:12px 24px;border-radius:12px;text-align:center;background:var(--bg);opacity:0;transition:.22s;overflow-wrap:anywhere}#subtitle.show{opacity:1;transform:translate(-50%,-50%)}
#english{color:var(--ec);font-size:var(--en);font-weight:750;line-height:1.18;-webkit-text-stroke:2px var(--stroke);paint-order:stroke fill;text-shadow:0 2px 5px var(--stroke)}#chinese{margin-bottom:5px;color:var(--zc);font-size:var(--zh);font-weight:650;-webkit-text-stroke:1px var(--stroke);paint-order:stroke fill;text-shadow:0 1px 3px var(--stroke)}
#connection{position:fixed;right:9px;top:9px;padding:5px 9px;border-radius:6px;color:#ddd;background:#222d;font-size:12px;display:none}body.debug-connection #connection{display:block}
.app{display:none;min-height:100%;padding:24px;color:#e9f0f7;background:#09111a}.app.visible{display:block}.shell{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}h1{margin:0;font-size:24px}h2{font-size:16px;margin:0 0 12px}.pill{padding:6px 10px;border-radius:99px;background:#243443;color:#b9d7ee}.pill.ok{background:#173e30;color:#8ff0be}.pill.bad{background:#4c2228;color:#ffc3c8}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}label{display:block;margin:12px 0 5px;color:#aebdca;font-size:13px}input,select,textarea,button{width:100%;padding:9px;border:1px solid #425466;border-radius:7px;color:#eef;background:#1d2a37;font:inherit}textarea{min-height:110px;resize:vertical}button{cursor:pointer;background:#244b6d}button:hover{background:#2d618d}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#8fa1b2;font-size:12px}.terms{width:100%;border-collapse:collapse}.terms td,.terms th{padding:6px;border-bottom:1px solid #2b3946;text-align:left}.terms input{padding:6px}.danger{background:#572b32;width:auto}
.debuggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.metric b{display:block;font-size:21px}.events{width:100%;min-width:1080px;table-layout:fixed;border-collapse:collapse;font-size:12px}.events th:nth-child(1){width:110px}.events th:nth-child(2){width:185px}.events th:nth-child(3){width:185px}.events th:nth-child(4){width:245px}.events th:nth-child(5){width:200px}.events th:nth-child(6){width:300px}.api-detail{max-height:300px;overflow:auto;background:#0d1520;padding:8px;border-radius:6px;margin-top:4px;font-size:11px}.events th,.events td{padding:8px;border-bottom:1px solid #263645;vertical-align:top;text-align:left}.events tr.error{background:#401e2488}.mono{font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.scroll{overflow:auto;max-height:65vh}@media(max-width:760px){.grid{grid-template-columns:1fr}.debuggrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="subtitle" role="status" aria-live="polite"><div id="chinese"></div><div id="english"></div></div><div id="connection"></div>
<main id="control" class="app"><div class="shell"><div class="top"><h1>翻译控制台</h1><span id="saveState" class="pill">正在读取…</span></div><div class="grid">
<section class="card"><h2>实时策略</h2><label>游戏 Profile</label><select id="profile"><option value="auto">自动识别</option><option value="general">通用</option><option value="iracing">iRacing</option><option value="minecraft">Minecraft</option><option value="project_zomboid">Project Zomboid</option><option value="disabled">禁用游戏术语</option></select><label>AI 纠错模式</label><select id="correctionMode"><option value="conservative">保守纠错</option><option value="off">关闭纠错（仍翻译）</option></select><label>字幕中文来源</label><select id="chineseSource"><option value="corrected">修正后中文</option><option value="raw">原始中文</option><option value="compare">原文与修正对照</option></select><label>上下文条数（0–5）</label><input id="contextSize" type="range" min="0" max="5"><div id="contextLabel" class="muted"></div><label>直播背景与自定义 Prompt</label><textarea id="customPrompt" placeholder="描述直播场景和翻译风格。不要填写 API 密钥。"></textarea><p class="muted">修改会自动保存并即时提交到运行时。页面不会读取或显示密钥。</p></section>
<section class="card"><div class="top"><h2>术语表</h2><button id="addTerm" style="width:auto">添加术语</button></div><div style="max-height:360px;overflow:auto"><table class="terms"><thead><tr><th>中文/误识别</th><th>目标写法/英文</th><th></th></tr></thead><tbody id="termRows"></tbody></table></div><div class="row" style="margin-top:12px"><button id="importTerms">导入 JSON / CSV</button><button id="exportTerms">导出 JSON</button><button id="resetTerms">恢复内置术语</button></div><input id="termFile" type="file" accept=".json,.csv,text/csv,application/json" hidden><p class="muted">导入后会立即保存；导出文件不包含任何密钥或服务配置。</p></section>
</div></div></main>
<main id="debug" class="app"><div class="shell"><div class="top"><h1>实时调试面板</h1><span id="debugState" class="pill">正在连接…</span></div><div class="debuggrid"><div class="metric"><span>事件</span><b id="mEvents">0</b></div><div class="metric"><span>平均总延迟</span><b id="mLatency">—</b></div><div class="metric"><span>Token / 缓存命中</span><b id="mTokens">0 / 0</b></div><div class="metric"><span>重试 / 错误</span><b id="mErrors">0 / 0</b></div></div><section class="card scroll"><table class="events"><thead><tr><th>时间/Profile</th><th>原始 → 修正</th><th>英文</th><th>上下文/术语</th><th>延迟与用量</th><th>API 请求/响应</th></tr></thead><tbody id="events"></tbody></table></section></div></main>
<script>(()=>{'use strict';
const $=s=>document.querySelector(s),path=location.pathname,params=new URLSearchParams(location.search),isControl=path==='/control',isDebug=path==='/debug';
if(isControl)return initControl();if(isDebug)return initDebug();initSubtitle();
function status(el,text,kind=''){el.textContent=text;el.className='pill '+kind}
function initSubtitle(){document.body.className='subtitle'+(params.get('debug')==='1'?' debug-connection':'');const defaults={mode:'bilingual',hideAfterMS:12000,englishFontSize:56,chineseFontSize:30,positionX:50,positionY:88,maxWidth:90,englishColor:'#fff',chineseColor:'#eee',strokeColor:'#000',background:'rgba(0,0,0,.48)',fontFamily:'Segoe UI, Microsoft YaHei, sans-serif',chineseSource:'corrected'};fetch('/config',{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({})).then(server=>{const c={...defaults,...server};for(const [q,k] of Object.entries({mode:'mode',hide:'hideAfterMS',enSize:'englishFontSize',zhSize:'chineseFontSize',x:'positionX',y:'positionY',width:'maxWidth',enColor:'englishColor',zhColor:'chineseColor',stroke:'strokeColor',bg:'background',font:'fontFamily',chinese:'chineseSource'})){if(params.has(q))c[k]=params.get(q)}applySubtitle(c);connectSubtitle(c)})}
function applySubtitle(c){const r=document.documentElement.style;r.setProperty('--en',`${Number(c.englishFontSize)}px`);r.setProperty('--zh',`${Number(c.chineseFontSize)}px`);r.setProperty('--x',`${Number(c.positionX)}%`);r.setProperty('--y',`${Number(c.positionY)}%`);r.setProperty('--width',`${Number(c.maxWidth)}%`);r.setProperty('--ec',c.englishColor);r.setProperty('--zc',c.chineseColor);r.setProperty('--stroke',c.strokeColor);r.setProperty('--bg',c.background);r.setProperty('--font',c.fontFamily);$('#chinese').style.display=c.mode==='english'?'none':'block'}
function connectSubtitle(c){let socket,timer,hideTimer;const info=$('#connection'),url=params.get('ws')||`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`;function connect(){info.textContent='正在连接';socket=new WebSocket(url);socket.onopen=()=>info.textContent='已连接';socket.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type&&m.type!=='subtitle')return;const raw=m.raw||m.source||'',corrected=m.corrected||m.source||raw,english=m.english||m.text||'';if(!english.trim()&&!corrected.trim())return;const chineseMode=params.get('chinese')||m.chineseSource||c.chineseSource,source=chineseMode==='raw'?raw:chineseMode==='compare'?(raw===corrected?corrected:`${raw} → ${corrected}`):corrected;$('#chinese').textContent=source;$('#english').textContent=english;$('#subtitle').classList.add('show');clearTimeout(hideTimer);if(Number(c.hideAfterMS)>0)hideTimer=setTimeout(()=>$('#subtitle').classList.remove('show'),Number(c.hideAfterMS))};socket.onclose=()=>{info.textContent='已断开，正在重连';clearTimeout(timer);timer=setTimeout(connect,2000)};socket.onerror=()=>socket.close()}connect()}
function initControl(){document.body.className='';$('#control').classList.add('visible');const badge=$('#saveState'),fields=['profile','correctionMode','chineseSource','contextSize','customPrompt'];let state={profile:'auto',correctionMode:'conservative',chineseSource:'corrected',contextSize:2,customPrompt:'',terms:[]},timer,loading=true,pendingTerms=false;function render(){state.terms=state.terms||[];for(const k of fields)$('#'+k).value=state[k];$('#contextLabel').textContent=`保留最近 ${state.contextSize} 条对话`;const rows=$('#termRows');rows.textContent='';state.terms.forEach((term,i)=>{const tr=document.createElement('tr');tr.innerHTML='<td><input data-k="source"></td><td><input data-k="target"></td><td><button class="danger">删除</button></td>';tr.querySelector('[data-k=source]').value=term.source;tr.querySelector('[data-k=target]').value=term.target;tr.querySelectorAll('input').forEach(x=>x.oninput=()=>{term[x.dataset.k]=x.value;queue(true)});tr.querySelector('button').onclick=()=>{state.terms.splice(i,1);render();queue(true)};rows.append(tr)})}
async function save(){clearTimeout(timer);status(badge,'正在应用…');const payload={...state,terms:pendingTerms?state.terms:null};pendingTerms=false;try{const r=await fetch('/api/control',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),body=await r.json();if(!r.ok)throw Error(body.error||r.statusText);state=body;render();status(badge,'已即时生效','ok')}catch(e){status(badge,'保存失败：'+e.message,'bad')}}function queue(terms=false){if(loading)return;pendingTerms=pendingTerms||terms;status(badge,'有未保存修改');clearTimeout(timer);timer=setTimeout(save,250)}
fields.filter(k=>k!=='profile').forEach(k=>$('#'+k).oninput=()=>{state[k]=k==='contextSize'?Number($('#'+k).value):$('#'+k).value;$('#contextLabel').textContent=`保留最近 ${state.contextSize} 条对话`;queue(false)});$('#profile').onchange=()=>{state.profile=$('#profile').value;pendingTerms=false;clearTimeout(timer);save()};$('#addTerm').onclick=()=>{state.terms.push({source:'',target:''});render()};$('#exportTerms').onclick=()=>{const blob=new Blob([JSON.stringify(state.terms,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='translation-terms.json';a.click();URL.revokeObjectURL(a.href)};$('#resetTerms').onclick=async()=>{if(!['iracing','minecraft','project_zomboid'].includes(state.profile))return status(badge,'当前 Profile 没有内置术语','bad');if(!confirm('恢复此游戏的内置术语并丢弃自定义修改？'))return;try{const r=await fetch('/api/control',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state,terms:null,resetTerms:true})}),body=await r.json();if(!r.ok)throw Error(body.error||r.statusText);state=body;render();status(badge,'已恢复内置术语','ok')}catch(e){status(badge,'恢复失败：'+e.message,'bad')}};$('#importTerms').onclick=()=>$('#termFile').click();$('#termFile').onchange=async e=>{try{const f=e.target.files[0],text=await f.text();state.terms=f.name.toLowerCase().endsWith('.csv')?text.split(/\r?\n/).filter(Boolean).map(line=>{const [source,...rest]=line.split(',');return{source:source.trim(),target:rest.join(',').trim()}}):JSON.parse(text);if(!Array.isArray(state.terms))throw Error('文件必须是术语数组');render();queue(true)}catch(x){status(badge,'导入失败：'+x.message,'bad')}};
fetch('/api/control',{cache:'no-store'}).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.error);state=b;render();loading=false;status(badge,'已连接，修改将即时生效','ok')}).catch(e=>status(badge,'无法读取：'+e.message,'bad'))}
function initDebug(){document.body.className='';$('#debug').classList.add('visible');const badge=$('#debugState'),rows=$('#events');let count=0,totalLatency=0,latencyCount=0,tokens=0,hits=0,retries=0,errors=0,socket,timer;function update(){ $('#mEvents').textContent=count;$('#mLatency').textContent=latencyCount?`${Math.round(totalLatency/latencyCount)} ms`:'—';$('#mTokens').textContent=`${tokens} / ${hits}`;$('#mErrors').textContent=`${retries} / ${errors}` }function add(d){count++;tokens+=d.tokens||0;hits+=d.cacheHit?1:0;retries+=d.retries||0;errors+=d.error?1:0;const values=Object.values(d.latencies||{}).filter(Number.isFinite),total=(d.latencies?.total??(values.length?values.reduce((a,b)=>a+b,0):null));if(total!=null){totalLatency+=total;latencyCount++}const tr=document.createElement('tr');if(d.error)tr.className='error';const diff=d.diff||(d.raw===d.corrected?d.raw:`${d.raw||''} → ${d.corrected||''}`);tr.innerHTML=`<td>${new Date((d.ts||Date.now()/1000)*1000).toLocaleTimeString()}<br><b>${esc(d.profile||'—')}</b><br>#${d.segmentId||'—'} ${esc(d.asrModel||'')}<br>${d.durationMs||0}ms / ${esc(d.segmentReason||'—')}</td><td class="mono">${esc(diff||'—')}</td><td>${esc(d.english||'—')}</td><td class="mono">上下文: ${esc((d.context||[]).join(' | ')||'—')}<br>术语: ${esc((d.terms||[]).join(', ')||'—')}</td><td class="mono">耗时 ${esc(JSON.stringify(d.latencies||{}))}<br>Token ${esc(JSON.stringify(d.tokenUsage||{total:d.tokens||0}))}<br>cache=${d.cacheHit?'hit':'miss'} retry=${d.retries||0}${d.error?'<br>错误: '+esc(d.error):''}</td><td>${d.requestBody?'<div class="api-detail"><b>请求:</b><br><pre>'+esc(d.requestBody)+'</pre></div>':''}${d.responseBody?'<div class="api-detail"><b>响应:</b><br><pre>'+esc(d.responseBody)+'</pre></div>':''}${!d.requestBody&&!d.responseBody?'<span class="muted">仅 DEBUG 模式</span>':''}</td>`;rows.prepend(tr);while(rows.children.length>100)rows.lastChild.remove();update()}function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}function connect(){status(badge,'正在连接…');socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/debug-ws`);socket.onopen=()=>status(badge,'实时数据已连接','ok');socket.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='debug'&&m.debug)add(m.debug)}catch{}};socket.onclose=()=>{status(badge,'已断开，正在重连','bad');clearTimeout(timer);timer=setTimeout(connect,2000)};socket.onerror=()=>socket.close()}connect()}
})();</script></body></html>
